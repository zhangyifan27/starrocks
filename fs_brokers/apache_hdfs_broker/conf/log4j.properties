log4j.rootLogger = INFO,R

log4j.appender.D = org.apache.log4j.DailyRollingFileAppender
log4j.appender.D.File = ${BROKER_LOG_DIR}/apache_hdfs_broker.log
log4j.appender.D.Append = true
log4j.appender.D.layout = org.apache.log4j.PatternLayout
log4j.appender.D.layout.ConversionPattern = %-d{yyyy-MM-dd HH:mm:ss}  [ %t:%r ] - [ %p ]  %m%n

log4j.appender.R = org.apache.log4j.RollingFileAppender
log4j.appender.R.File = ${BROKER_LOG_DIR}/apache_hdfs_broker.log
log4j.appender.R.Append = true
log4j.appender.R.MaxFileSize = 1GB
log4j.appender.R.MaxBackupIndex = 5
log4j.appender.R.layout = org.apache.log4j.PatternLayout
log4j.appender.R.layout.ConversionPattern = %-d{yyyy-MM-dd HH:mm:ss}  [ %t:%r ] - [ %p ]  %m%n